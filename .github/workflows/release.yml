name: Release containers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Backend + frontend test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Backend test + jacoco + spotless
        working-directory: backend
        run: ./gradlew test jacocoTestCoverageVerification spotlessCheck
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend deps
        working-directory: frontend
        run: npm ci
      - name: Frontend lint + build + test
        working-directory: frontend
        run: |
          npm run lint
          npm run build
          npm run test

  images:
    name: Build + push images (GHCR)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image metadata
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "latest_marker=${TAG}" >> "$GITHUB_OUTPUT"
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push openvpn
        uses: docker/build-push-action@v6
        with:
          context: ./openvpn
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/openvpn:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository }}/openvpn:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  package:
    name: Package deploy tarball
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate changelog
        id: changelog
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -A1 "^${TAG}$" | tail -1)
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$TAG" ]; then
            CHANGES=$(git log --oneline --no-decorate "${TAG}" | head -50)
          else
            CHANGES=$(git log --oneline --no-decorate "${PREV_TAG}..${TAG}")
          fi
          echo "changes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: Stage deploy-only files and build tarball
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p "release/passage-vpn-${TAG}"
          cp docker-compose.yml docker-compose.postgres.yml .env.example install.sh "release/passage-vpn-${TAG}/"
          cp docs/installation.md "release/passage-vpn-${TAG}/README.md"
          tar -czf "passage-vpn-${TAG}.tar.gz" -C release "passage-vpn-${TAG}"
          echo "Built passage-vpn-${TAG}.tar.gz"
      - name: Attach tarball to release
        uses: softprops/action-gh-release@v2
        with:
          files: passage-vpn-${{ github.ref_name }}.tar.gz
          body: |
            ## Changes
            ${{ steps.changelog.outputs.changes }}
            
            ## Installation
            See [installation.md](docs/installation.md) for setup instructions.

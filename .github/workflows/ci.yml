name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Backend test
        working-directory: backend
        run: ./gradlew test jacocoTestCoverageVerification spotlessCheck

  frontend:
    name: Frontend build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend deps
        working-directory: frontend
        run: npm ci
      - name: Frontend dependency audit (F1.2)
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Frontend lint + build + test (with coverage gate)
        working-directory: frontend
        run: |
          npm run lint
          npm run build
          npm run test:coverage

  docker-build:
    name: Docker image build (backend/frontend/openvpn)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build service images
        run: docker compose build backend frontend openvpn

  smoke-test:
    name: Smoke test (backend health check)
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        run: docker compose build backend
      - name: Start backend service
        run: |
          mkdir -p .github
          printf 'PASSAGE_JWT_SECRET=01234567890123456789012345678901\n' > .env
          printf 'PASSAGE_OPENVPN_MGMT_PASSWORD=ci-test-password\n' >> .env
          printf 'PASSAGE_DATA_DIR=/var/lib/passage\n' >> .env
          docker compose up -d --no-deps backend
      - name: Wait for backend to be healthy
        run: |
          echo "Waiting for backend container to be healthy..."
          timeout 120 bash -c '
            until docker inspect --format="{{.State.Health.Status}}" passage-backend 2>/dev/null | grep -q healthy; do
              sleep 2
            done
          '
          echo "Backend is healthy."
      - name: Verify /actuator/health endpoint
        run: |
          # The backend port is not published to the host (frontend proxies to backend:8080),
          # so probe the endpoint from inside the container, like the healthcheck does.
          STATUS=$(docker compose exec -T backend curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health || echo failed)
          if [ "$STATUS" -ne 200 ]; then
            echo "ERROR: /actuator/health returned HTTP $STATUS (expected 200)"
            docker compose logs backend
            exit 1
          fi
          echo "/actuator/health returned HTTP 200"
      - name: Cleanup
        if: always()
        run: docker compose down -v

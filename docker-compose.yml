name: opnl

services:
  # --- OpenVPN daemon(s) + management interface ---
  openvpn:
    build: ./openvpn
    image: ${OPNL_IMAGE_REGISTRY:-ghcr.io}/${OPNL_IMAGE_NAMESPACE:-ugurcsen/opnl-vpn}/openvpn:${OPNL_IMAGE_TAG:-latest}
    container_name: opnl-openvpn
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    devices:
      - /dev/net/tun          # TUN device for the VPN tunnel
    cap_add:
      - NET_ADMIN          # iptables-based access control (documented, required)
      - SYS_MODULE         # optional: tun module / DCO
    sysctls:
      - net.ipv6.conf.all.forwarding=1   # IPv6 (dual-stack) tunnel routing
      - net.ipv6.conf.default.forwarding=1
      - net.ipv6.conf.all.disable_ipv6=0
    volumes:
      - opnl-pki:/etc/opnl/pki        # PKI lives in pki/run (easyrsa cannot rm -rf a mountpoint)
      - opnl-ccd:/etc/opnl/ccd
      - opnl-config:/etc/opnl/config
      - opnl-logs:/var/log/opnl
    environment:
      OPNL_INTERNAL_BASE_URL: http://backend:8080
      OPNL_PKI_DIR: /etc/opnl/pki/run
    networks:
      - opnl-net
    ports:
      - "${OPNL_OPENVPN_PORT:-1194}:1194/udp"
      - "${OPNL_OPENVPN_TCP_PORT:-1195}:1195/tcp"
    expose:
      - "7505-7510"        # management interface per daemon (daemon 0 = 7505)

  # --- Management panel backend (Spring Boot) ---
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ${OPNL_IMAGE_REGISTRY:-ghcr.io}/${OPNL_IMAGE_NAMESPACE:-ugurcsen/opnl-vpn}/backend:${OPNL_IMAGE_TAG:-latest}
    container_name: opnl-backend
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2.0
    healthcheck:
      # curl is present in the runtime image; OPNL_SERVER_PORT is expanded inside the
      # container ($$ escapes compose interpolation so it can vary per deployment).
      test: ["CMD-SHELL", "curl -fsS http://localhost:$${OPNL_SERVER_PORT:-8080}/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    env_file:
      - .env
    environment:
      OPNL_DATA_DIR: /var/lib/opnl
      OPNL_DB_URL: "jdbc:sqlite:/var/lib/opnl/opnl.db?journal_mode=WAL&busy_timeout=5000&foreign_keys=on"
      OPNL_PKI_DIR: /etc/opnl/pki/run
      OPNL_CCD_DIR: /etc/opnl/ccd
      OPNL_CONFIG_DIR: /etc/opnl/config
      OPNL_SCRIPTS_DIR: /etc/opnl/config/scripts
      OPNL_SCRIPTS_SRC_DIR: /app/openvpn-scripts
      OPNL_LOG_DIR: /var/log/opnl
      OPNL_OPENVPN_MGMT_HOST: openvpn
      OPNL_OPENVPN_MGMT_PORT: 7505
      OPNL_OPENVPN_MGMT_PASSWORD: ${OPNL_OPENVPN_MGMT_PASSWORD:-}
      OPNL_INTERNAL_BASE_URL: http://backend:8080
      OPNL_INTERNAL_TOKEN: ${OPNL_INTERNAL_TOKEN:-change-me-internal-token}
      OPNL_BOOTSTRAP_TOKEN: ${OPNL_BOOTSTRAP_TOKEN:-}
      OPNL_INTERNAL_MTLS_PORT: ${OPNL_INTERNAL_MTLS_PORT:-9443}
      OPNL_INTERNAL_TLS_DIR: /var/lib/opnl/internal-tls
      OPNL_TRUSTED_PROXIES: ${OPNL_TRUSTED_PROXIES:-172.16.0.0/12}
    volumes:
      - opnl-data:/var/lib/opnl
      - opnl-pki:/etc/opnl/pki
      - opnl-ccd:/etc/opnl/ccd
      - opnl-config:/etc/opnl/config
      - opnl-logs:/var/log/opnl
    depends_on:
      - openvpn
    networks:
      - opnl-net

  # --- Frontend (nginx: static React + reverse proxy to backend) ---
  frontend:
    build: ./frontend
    image: ${OPNL_IMAGE_REGISTRY:-ghcr.io}/${OPNL_IMAGE_NAMESPACE:-ugurcsen/opnl-vpn}/frontend:${OPNL_IMAGE_TAG:-latest}
    container_name: opnl-frontend
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    depends_on:
      - backend
    networks:
      - opnl-net
    ports:
      - "${OPNL_FRONTEND_PORT:-80}:80"

  # --- Remote node gateway (opt-in; start on a gateway node with --profile node) ---
  # Registers/heartbeats to the central backend over the internal mTLS endpoint, must
  # present an agent client certificate (see /api/admin/nodes/{id}/agent-cert), and pulls
  # its config bundle (daemon configs, PKI incl. the CRL, CCD, scripts, dnsmasq) from the
  # central backend so its OpenVPN daemons are provisioned and updated like the local ones.
  #   docker compose --profile node up -d opnl-node-openvpn opnl-agent
  opnl-node-openvpn:
    profiles: ["node"]
    build: ./openvpn
    image: ${OPNL_IMAGE_REGISTRY:-ghcr.io}/${OPNL_IMAGE_NAMESPACE:-ugurcsen/opnl-vpn}/openvpn:${OPNL_IMAGE_TAG:-latest}
    container_name: opnl-node-openvpn
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    devices:
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1
      - net.ipv6.conf.all.disable_ipv6=0
    volumes:
      - opnl-node-pki:/etc/opnl/pki
      - opnl-node-ccd:/etc/opnl/ccd
      - opnl-node-config:/etc/opnl/config
      - opnl-node-logs:/var/log/opnl
    environment:
      OPNL_PKI_DIR: /etc/opnl/pki/run
      # Script callbacks (verify-user-pass, client-connect, ...) reach the CENTRAL backend.
      # Defaults to the compose-internal URL for single-host testing; on a real remote gateway
      # point this at the central backend's reachable address (e.g. https://vpn.example.com:9443).
      OPNL_INTERNAL_BASE_URL: ${OPNL_NODE_INTERNAL_BASE_URL:-http://backend:8080}
    networks:
      - opnl-net
    ports:
      - "${OPNL_NODE_OPENVPN_PORT:-1196}:1194/udp"
      - "${OPNL_NODE_OPENVPN_TCP_PORT:-1197}:1195/tcp"
    expose:
      - "7505-7510"        # management interface per daemon (daemon 0 = 7505)

  opnl-agent:
    profiles: ["node"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ${OPNL_IMAGE_REGISTRY:-ghcr.io}/${OPNL_IMAGE_NAMESPACE:-ugurcsen/opnl-vpn}/backend:${OPNL_IMAGE_TAG:-latest}
    container_name: opnl-node-agent
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    environment:
      OPNL_PROFILE: agent
      OPNL_AGENT_CENTRAL_BASE_URL: ${OPNL_AGENT_CENTRAL_BASE_URL:-https://backend:9443}
      OPNL_AGENT_NODE_NAME: ${OPNL_AGENT_NODE_NAME:-}
      OPNL_AGENT_MGMT_HOST: ${OPNL_AGENT_MGMT_HOST:-openvpn}
      OPNL_AGENT_MGMT_PORT_BASE: ${OPNL_AGENT_MGMT_PORT_BASE:-7505}
      OPNL_AGENT_ADMIN_IP: ${OPNL_AGENT_ADMIN_IP:-}
      OPNL_AGENT_MGMT_PASSWORD: ${OPNL_AGENT_MGMT_PASSWORD:-}
      OPNL_AGENT_HEARTBEAT_SECONDS: ${OPNL_AGENT_HEARTBEAT_SECONDS:-30}
      OPNL_AGENT_SYNC_SECONDS: ${OPNL_AGENT_SYNC_SECONDS:-60}
      OPNL_AGENT_TLS_CA: ${OPNL_AGENT_TLS_CA:-/etc/opnl/agent/tls/ca.crt}
      OPNL_AGENT_TLS_CERT: ${OPNL_AGENT_TLS_CERT:-/etc/opnl/agent/tls/client.crt}
      OPNL_AGENT_TLS_KEY: ${OPNL_AGENT_TLS_KEY:-/etc/opnl/agent/tls/client.key}
      OPNL_INTERNAL_TOKEN: ${OPNL_INTERNAL_TOKEN:-change-me-internal-token}
      # Core secrets the agent image needs to pass its own startup checks (SecurityBootstrapCheck
      # and JwtService are profile-independent). Same values as the central backend. Soft defaults
      # keep `docker compose build` usable without a .env; the backend's own fail-fast checks
      # (SecurityBootstrapCheck / JwtService 32-byte minimum) still refuse to start otherwise.
      OPNL_JWT_SECRET: ${OPNL_JWT_SECRET:-}
      OPNL_OPENVPN_MGMT_PASSWORD: ${OPNL_OPENVPN_MGMT_PASSWORD:-}
      OPNL_SERVER_PORT: ${OPNL_SERVER_PORT:-8080}
      # The gateway volumes the agent provisions for its own openvpn container (same layout
      # as the central stack, so the pulled daemon configs are valid here verbatim).
      OPNL_PKI_DIR: /etc/opnl/pki/run
      OPNL_CCD_DIR: /etc/opnl/ccd
      OPNL_CONFIG_DIR: /etc/opnl/config
      OPNL_SCRIPTS_DIR: /etc/opnl/config/scripts
      OPNL_LOG_DIR: /var/log/opnl
    volumes:
      - ${OPNL_AGENT_TLS_DIR:-./data/agent-tls}:/etc/opnl/agent/tls:ro
      - opnl-node-pki:/etc/opnl/pki
      - opnl-node-ccd:/etc/opnl/ccd
      - opnl-node-config:/etc/opnl/config
      - opnl-node-logs:/var/log/opnl
    depends_on:
      - opnl-node-openvpn
    networks:
      - opnl-net
    expose:
      - "8080"

  # --- CI / test runners (build stage; activate with --profile ci) ---
  # docker compose --profile ci run --rm backend-build test
  # docker compose --profile ci run --rm frontend-build run test
  backend-build:
    profiles: ["ci"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: build
    image: opnl-backend-build
    entrypoint: ["./gradlew"]
    networks:
      - opnl-net

  frontend-build:
    profiles: ["ci"]
    build:
      context: ./frontend
      target: build
    image: opnl-frontend-build
    entrypoint: ["npm"]
    networks:
      - opnl-net

networks:
  opnl-net:
    driver: bridge
    enable_ipv6: true
    # No explicit ipam subnets: Docker auto-allocates IPv4 from its default address
    # pools and a unique random IPv6 ULA (/64). Pinning fixed subnets (e.g.
    # 172.18.0.0/16, fd00:2::/112) collides with other stacks sharing the same host
    # ("invalid pool request: Pool overlaps with other one on this address space").

volumes:
  opnl-data:
  opnl-pki:
  opnl-ccd:
  opnl-config:
  opnl-logs:
  opnl-node-pki:
  opnl-node-ccd:
  opnl-node-config:
  opnl-node-logs:

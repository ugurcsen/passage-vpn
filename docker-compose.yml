name: passage

services:
  # --- OpenVPN daemon(s) + management interface ---
  openvpn:
    build: ./openvpn
    image: ${PASSAGE_IMAGE_REGISTRY:-ghcr.io}/${PASSAGE_IMAGE_NAMESPACE:-ugurcsen/passage-vpn}/openvpn:${PASSAGE_IMAGE_TAG:-latest}
    container_name: passage-openvpn
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    devices:
      - /dev/net/tun          # TUN device for the VPN tunnel
    cap_add:
      - NET_ADMIN          # iptables-based access control (documented, required)
      - SYS_MODULE         # optional: tun module / DCO
    sysctls:
      - net.ipv6.conf.all.forwarding=1   # IPv6 (dual-stack) tunnel routing
      - net.ipv6.conf.default.forwarding=1
      - net.ipv6.conf.all.disable_ipv6=0
    volumes:
      - passage-pki:/etc/passage/pki        # PKI lives in pki/run (easyrsa cannot rm -rf a mountpoint)
      - passage-ccd:/etc/passage/ccd
      - passage-config:/etc/passage/config
      - passage-logs:/var/log/passage
    environment:
      PASSAGE_INTERNAL_BASE_URL: http://backend:8080
      PASSAGE_PKI_DIR: /etc/passage/pki/run
    networks:
      - passage-net
    ports:
      # Published daemon port ranges (base..end per protocol). *_END defaults to the base, i.e. a
      # single published port; widen it (e.g. PASSAGE_OPENVPN_PORT_END=1199) so additional daemons
      # are reachable. Container side equals the host side: a daemon's configured port is both.
      - "${PASSAGE_OPENVPN_PORT:-1194}-${PASSAGE_OPENVPN_PORT_END:-1194}:${PASSAGE_OPENVPN_PORT:-1194}-${PASSAGE_OPENVPN_PORT_END:-1194}/udp"
      - "${PASSAGE_OPENVPN_TCP_PORT:-1195}-${PASSAGE_OPENVPN_TCP_PORT_END:-1195}:${PASSAGE_OPENVPN_TCP_PORT:-1195}-${PASSAGE_OPENVPN_TCP_PORT_END:-1195}/tcp"
    expose:
      - "7505-7510"        # management interface per daemon (daemon 0 = 7505)

  # --- Management panel backend (Spring Boot) ---
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ${PASSAGE_IMAGE_REGISTRY:-ghcr.io}/${PASSAGE_IMAGE_NAMESPACE:-ugurcsen/passage-vpn}/backend:${PASSAGE_IMAGE_TAG:-latest}
    container_name: passage-backend
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2.0
    healthcheck:
      # curl is present in the runtime image; PASSAGE_SERVER_PORT is expanded inside the
      # container ($$ escapes compose interpolation so it can vary per deployment).
      test: ["CMD-SHELL", "curl -fsS http://localhost:$${PASSAGE_SERVER_PORT:-8080}/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    env_file:
      - .env
    environment:
      PASSAGE_DATA_DIR: /var/lib/passage
      PASSAGE_DB_URL: "jdbc:sqlite:/var/lib/passage/passage.db?journal_mode=WAL&busy_timeout=5000&foreign_keys=on"
      PASSAGE_PKI_DIR: /etc/passage/pki/run
      PASSAGE_CCD_DIR: /etc/passage/ccd
      PASSAGE_CONFIG_DIR: /etc/passage/config
      PASSAGE_SCRIPTS_DIR: /etc/passage/config/scripts
      PASSAGE_SCRIPTS_SRC_DIR: /app/openvpn-scripts
      PASSAGE_LOG_DIR: /var/log/passage
      PASSAGE_OPENVPN_MGMT_HOST: openvpn
      PASSAGE_OPENVPN_MGMT_PORT: 7505
      PASSAGE_OPENVPN_MGMT_PASSWORD: ${PASSAGE_OPENVPN_MGMT_PASSWORD:-}
      PASSAGE_INTERNAL_BASE_URL: http://backend:8080
      PASSAGE_INTERNAL_TOKEN: ${PASSAGE_INTERNAL_TOKEN:-change-me-internal-token}
      PASSAGE_BOOTSTRAP_TOKEN: ${PASSAGE_BOOTSTRAP_TOKEN:-}
      PASSAGE_INTERNAL_MTLS_PORT: ${PASSAGE_INTERNAL_MTLS_PORT:-9443}
      PASSAGE_INTERNAL_TLS_DIR: /var/lib/passage/internal-tls
      PASSAGE_TRUSTED_PROXIES: ${PASSAGE_TRUSTED_PROXIES:-172.16.0.0/12}
    volumes:
      - passage-data:/var/lib/passage
      - passage-pki:/etc/passage/pki
      - passage-ccd:/etc/passage/ccd
      - passage-config:/etc/passage/config
      - passage-logs:/var/log/passage
    depends_on:
      - openvpn
    networks:
      - passage-net

  # --- Frontend (nginx: static React + reverse proxy to backend) ---
  frontend:
    build: ./frontend
    image: ${PASSAGE_IMAGE_REGISTRY:-ghcr.io}/${PASSAGE_IMAGE_NAMESPACE:-ugurcsen/passage-vpn}/frontend:${PASSAGE_IMAGE_TAG:-latest}
    container_name: passage-frontend
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    depends_on:
      - backend
    networks:
      - passage-net
    ports:
      - "${PASSAGE_FRONTEND_PORT:-80}:80"

  # --- Remote node gateway (opt-in; start on a gateway node with --profile node) ---
  # Registers/heartbeats to the central backend over the internal mTLS endpoint, must
  # present an agent client certificate (see /api/admin/nodes/{id}/agent-cert), and pulls
  # its config bundle (daemon configs, PKI incl. the CRL, CCD, scripts, dnsmasq) from the
  # central backend so its OpenVPN daemons are provisioned and updated like the local ones.
  #   docker compose --profile node up -d passage-node-openvpn passage-agent
  passage-node-openvpn:
    profiles: ["node"]
    build: ./openvpn
    image: ${PASSAGE_IMAGE_REGISTRY:-ghcr.io}/${PASSAGE_IMAGE_NAMESPACE:-ugurcsen/passage-vpn}/openvpn:${PASSAGE_IMAGE_TAG:-latest}
    container_name: passage-node-openvpn
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    devices:
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1
      - net.ipv6.conf.all.disable_ipv6=0
    volumes:
      - passage-node-pki:/etc/passage/pki
      - passage-node-ccd:/etc/passage/ccd
      - passage-node-config:/etc/passage/config
      - passage-node-logs:/var/log/passage
    environment:
      PASSAGE_PKI_DIR: /etc/passage/pki/run
      # Script callbacks (verify-user-pass, client-connect, ...) reach the CENTRAL backend.
      # Defaults to the compose-internal URL for single-host testing; on a real remote gateway
      # point this at the central backend's reachable address (e.g. https://vpn.example.com:9443).
      PASSAGE_INTERNAL_BASE_URL: ${PASSAGE_NODE_INTERNAL_BASE_URL:-http://backend:8080}
    networks:
      - passage-net
    ports:
      - "${PASSAGE_NODE_OPENVPN_PORT:-1196}-${PASSAGE_NODE_OPENVPN_PORT_END:-1196}:${PASSAGE_NODE_OPENVPN_PORT:-1196}-${PASSAGE_NODE_OPENVPN_PORT_END:-1196}/udp"
      - "${PASSAGE_NODE_OPENVPN_TCP_PORT:-1197}-${PASSAGE_NODE_OPENVPN_TCP_PORT_END:-1197}:${PASSAGE_NODE_OPENVPN_TCP_PORT:-1197}-${PASSAGE_NODE_OPENVPN_TCP_PORT_END:-1197}/tcp"
    expose:
      - "7505-7510"        # management interface per daemon (daemon 0 = 7505)

  passage-agent:
    profiles: ["node"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ${PASSAGE_IMAGE_REGISTRY:-ghcr.io}/${PASSAGE_IMAGE_NAMESPACE:-ugurcsen/passage-vpn}/backend:${PASSAGE_IMAGE_TAG:-latest}
    container_name: passage-node-agent
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    environment:
      PASSAGE_PROFILE: agent
      PASSAGE_AGENT_CENTRAL_BASE_URL: ${PASSAGE_AGENT_CENTRAL_BASE_URL:-https://backend:9443}
      PASSAGE_AGENT_NODE_NAME: ${PASSAGE_AGENT_NODE_NAME:-}
      PASSAGE_AGENT_MGMT_HOST: ${PASSAGE_AGENT_MGMT_HOST:-openvpn}
      PASSAGE_AGENT_MGMT_PORT_BASE: ${PASSAGE_AGENT_MGMT_PORT_BASE:-7505}
      PASSAGE_AGENT_ADMIN_IP: ${PASSAGE_AGENT_ADMIN_IP:-}
      PASSAGE_AGENT_MGMT_PASSWORD: ${PASSAGE_AGENT_MGMT_PASSWORD:-}
      PASSAGE_AGENT_HEARTBEAT_SECONDS: ${PASSAGE_AGENT_HEARTBEAT_SECONDS:-30}
      PASSAGE_AGENT_SYNC_SECONDS: ${PASSAGE_AGENT_SYNC_SECONDS:-60}
      PASSAGE_AGENT_TLS_CA: ${PASSAGE_AGENT_TLS_CA:-/etc/passage/agent/tls/ca.crt}
      PASSAGE_AGENT_TLS_CERT: ${PASSAGE_AGENT_TLS_CERT:-/etc/passage/agent/tls/client.crt}
      PASSAGE_AGENT_TLS_KEY: ${PASSAGE_AGENT_TLS_KEY:-/etc/passage/agent/tls/client.key}
      PASSAGE_INTERNAL_TOKEN: ${PASSAGE_INTERNAL_TOKEN:-change-me-internal-token}
      # Core secrets the agent image needs to pass its own startup checks (SecurityBootstrapCheck
      # and JwtService are profile-independent). Same values as the central backend. Soft defaults
      # keep `docker compose build` usable without a .env; the backend's own fail-fast checks
      # (SecurityBootstrapCheck / JwtService 32-byte minimum) still refuse to start otherwise.
      PASSAGE_JWT_SECRET: ${PASSAGE_JWT_SECRET:-}
      PASSAGE_OPENVPN_MGMT_PASSWORD: ${PASSAGE_OPENVPN_MGMT_PASSWORD:-}
      PASSAGE_SERVER_PORT: ${PASSAGE_SERVER_PORT:-8080}
      # The gateway volumes the agent provisions for its own openvpn container (same layout
      # as the central stack, so the pulled daemon configs are valid here verbatim).
      PASSAGE_PKI_DIR: /etc/passage/pki/run
      PASSAGE_CCD_DIR: /etc/passage/ccd
      PASSAGE_CONFIG_DIR: /etc/passage/config
      PASSAGE_SCRIPTS_DIR: /etc/passage/config/scripts
      PASSAGE_LOG_DIR: /var/log/passage
    volumes:
      - ${PASSAGE_AGENT_TLS_DIR:-./data/agent-tls}:/etc/passage/agent/tls:ro
      - passage-node-pki:/etc/passage/pki
      - passage-node-ccd:/etc/passage/ccd
      - passage-node-config:/etc/passage/config
      - passage-node-logs:/var/log/passage
    depends_on:
      - passage-node-openvpn
    networks:
      - passage-net
    expose:
      - "8080"

  # --- CI / test runners (build stage; activate with --profile ci) ---
  # docker compose --profile ci run --rm backend-build test
  # docker compose --profile ci run --rm frontend-build run test
  backend-build:
    profiles: ["ci"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: build
    image: passage-backend-build
    entrypoint: ["./gradlew"]
    networks:
      - passage-net

  frontend-build:
    profiles: ["ci"]
    build:
      context: ./frontend
      target: build
    image: passage-frontend-build
    entrypoint: ["npm"]
    networks:
      - passage-net

networks:
  passage-net:
    driver: bridge
    enable_ipv6: true
    # No explicit ipam subnets: Docker auto-allocates IPv4 from its default address
    # pools and a unique random IPv6 ULA (/64). Pinning fixed subnets (e.g.
    # 172.18.0.0/16, fd00:2::/112) collides with other stacks sharing the same host
    # ("invalid pool request: Pool overlaps with other one on this address space").

volumes:
  passage-data:
  passage-pki:
  passage-ccd:
  passage-config:
  passage-logs:
  passage-node-pki:
  passage-node-ccd:
  passage-node-config:
  passage-node-logs:

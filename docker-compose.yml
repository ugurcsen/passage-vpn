name: opnl

services:
  # --- OpenVPN daemon(s) + management interface ---
  openvpn:
    build: ./openvpn
    container_name: opnl-openvpn
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    devices:
      - /dev/net/tun          # TUN device for the VPN tunnel
    cap_add:
      - NET_ADMIN          # iptables-based access control (documented, required)
      - SYS_MODULE         # optional: tun module / DCO
    sysctls:
      - net.ipv6.conf.all.forwarding=1   # IPv6 (dual-stack) tunnel routing
      - net.ipv6.conf.default.forwarding=1
      - net.ipv6.conf.all.disable_ipv6=0
    volumes:
      - opnl-pki:/etc/opnl/pki        # PKI lives in pki/run (easyrsa cannot rm -rf a mountpoint)
      - opnl-ccd:/etc/opnl/ccd
      - opnl-config:/etc/opnl/config
      - opnl-logs:/var/log/opnl
    environment:
      OPNL_INTERNAL_BASE_URL: http://backend:8080
      OPNL_PKI_DIR: /etc/opnl/pki/run
    networks:
      - opnl-net
    ports:
      - "${OPNL_OPENVPN_PORT:-1194}:1194/udp"
      - "${OPNL_OPENVPN_TCP_PORT:-1195}:1195/tcp"
    expose:
      - "7505-7510"        # management interface per daemon (daemon 0 = 7505)

  # --- Management panel backend (Spring Boot) ---
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: opnl-backend
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2.0
    env_file:
      - .env
    environment:
      OPNL_DATA_DIR: /var/lib/opnl
      OPNL_DB_URL: "jdbc:sqlite:/var/lib/opnl/opnl.db?journal_mode=WAL&busy_timeout=5000&foreign_keys=on"
      OPNL_PKI_DIR: /etc/opnl/pki/run
      OPNL_CCD_DIR: /etc/opnl/ccd
      OPNL_CONFIG_DIR: /etc/opnl/config
      OPNL_SCRIPTS_DIR: /etc/opnl/config/scripts
      OPNL_SCRIPTS_SRC_DIR: /app/openvpn-scripts
      OPNL_LOG_DIR: /var/log/opnl
      OPNL_OPENVPN_MGMT_HOST: openvpn
      OPNL_OPENVPN_MGMT_PORT: 7505
      OPNL_OPENVPN_MGMT_PASSWORD: ${OPNL_OPENVPN_MGMT_PASSWORD:-}
      OPNL_INTERNAL_BASE_URL: http://backend:8080
      OPNL_INTERNAL_TOKEN: ${OPNL_INTERNAL_TOKEN:-change-me-internal-token}
      OPNL_BOOTSTRAP_TOKEN: ${OPNL_BOOTSTRAP_TOKEN:-}
      OPNL_INTERNAL_MTLS_PORT: ${OPNL_INTERNAL_MTLS_PORT:-9443}
      OPNL_INTERNAL_TLS_DIR: /var/lib/opnl/internal-tls
      OPNL_TRUSTED_PROXIES: ${OPNL_TRUSTED_PROXIES:-172.16.0.0/12}
    volumes:
      - opnl-data:/var/lib/opnl
      - opnl-pki:/etc/opnl/pki
      - opnl-ccd:/etc/opnl/ccd
      - opnl-config:/etc/opnl/config
      - opnl-logs:/var/log/opnl
    depends_on:
      - openvpn
    networks:
      - opnl-net

  # --- Frontend (nginx: static React + reverse proxy to backend) ---
  frontend:
    build: ./frontend
    container_name: opnl-frontend
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    depends_on:
      - backend
    networks:
      - opnl-net
    ports:
      - "${OPNL_FRONTEND_PORT:-80}:80"

  # --- Remote node agent (opt-in; start on a gateway node with --profile node) ---
  # Registers/heartbeats to the central backend over the internal mTLS endpoint and must
  # present an agent client certificate (see /api/admin/nodes/{id}/agent-cert).
  #   docker compose --profile node up -d opnl-agent
  opnl-agent:
    profiles: ["node"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: opnl-node-agent
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    environment:
      OPNL_PROFILE: agent
      OPNL_AGENT_CENTRAL_BASE_URL: ${OPNL_AGENT_CENTRAL_BASE_URL:-https://backend:9443}
      OPNL_AGENT_NODE_NAME: ${OPNL_AGENT_NODE_NAME:-}
      OPNL_AGENT_MGMT_HOST: ${OPNL_AGENT_MGMT_HOST:-openvpn}
      OPNL_AGENT_MGMT_PORT_BASE: ${OPNL_AGENT_MGMT_PORT_BASE:-7505}
      OPNL_AGENT_ADMIN_IP: ${OPNL_AGENT_ADMIN_IP:-}
      OPNL_AGENT_MGMT_PASSWORD: ${OPNL_AGENT_MGMT_PASSWORD:-}
      OPNL_AGENT_HEARTBEAT_SECONDS: ${OPNL_AGENT_HEARTBEAT_SECONDS:-30}
      OPNL_AGENT_TLS_CA: ${OPNL_AGENT_TLS_CA:-/etc/opnl/agent/tls/ca.crt}
      OPNL_AGENT_TLS_CERT: ${OPNL_AGENT_TLS_CERT:-/etc/opnl/agent/tls/client.crt}
      OPNL_AGENT_TLS_KEY: ${OPNL_AGENT_TLS_KEY:-/etc/opnl/agent/tls/client.key}
      OPNL_INTERNAL_TOKEN: ${OPNL_INTERNAL_TOKEN:-change-me-internal-token}
      OPNL_SERVER_PORT: ${OPNL_SERVER_PORT:-8080}
    volumes:
      - ${OPNL_AGENT_TLS_DIR:-./data/agent-tls}:/etc/opnl/agent/tls:ro
    networks:
      - opnl-net
    expose:
      - "8080"

  # --- CI / test runners (build stage; activate with --profile ci) ---
  # docker compose --profile ci run --rm backend-build test
  # docker compose --profile ci run --rm frontend-build run test
  backend-build:
    profiles: ["ci"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: build
    image: opnl-backend-build
    entrypoint: ["./gradlew"]
    networks:
      - opnl-net

  frontend-build:
    profiles: ["ci"]
    build:
      context: ./frontend
      target: build
    image: opnl-frontend-build
    entrypoint: ["npm"]
    networks:
      - opnl-net

networks:
  opnl-net:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.18.0.0/16
        - subnet: fd00:2::/112

volumes:
  opnl-data:
  opnl-pki:
  opnl-ccd:
  opnl-config:
  opnl-logs:

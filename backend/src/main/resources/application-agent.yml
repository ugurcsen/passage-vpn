opnl:
  agent:
    central-base-url: ${OPNL_AGENT_CENTRAL_BASE_URL:https://backend:9443}
    node-name: ${OPNL_AGENT_NODE_NAME:}
    mgmt-host: ${OPNL_AGENT_MGMT_HOST:openvpn}
    mgmt-port-base: ${OPNL_AGENT_MGMT_PORT_BASE:7505}
    admin-ip: ${OPNL_AGENT_ADMIN_IP:}
    mgmt-password: ${OPNL_AGENT_MGMT_PASSWORD:}
    heartbeat-seconds: ${OPNL_AGENT_HEARTBEAT_SECONDS:30}
    sync-seconds: ${OPNL_AGENT_SYNC_SECONDS:60}
    tls-ca: ${OPNL_AGENT_TLS_CA:}
    tls-cert: ${OPNL_AGENT_TLS_CERT:}
    tls-key: ${OPNL_AGENT_TLS_KEY:}

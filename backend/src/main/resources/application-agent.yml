passage:
  agent:
    central-base-url: ${PASSAGE_AGENT_CENTRAL_BASE_URL:https://backend:9443}
    node-name: ${PASSAGE_AGENT_NODE_NAME:}
    mgmt-host: ${PASSAGE_AGENT_MGMT_HOST:openvpn}
    mgmt-port-base: ${PASSAGE_AGENT_MGMT_PORT_BASE:7505}
    admin-ip: ${PASSAGE_AGENT_ADMIN_IP:}
    mgmt-password: ${PASSAGE_AGENT_MGMT_PASSWORD:}
    heartbeat-seconds: ${PASSAGE_AGENT_HEARTBEAT_SECONDS:30}
    sync-seconds: ${PASSAGE_AGENT_SYNC_SECONDS:60}
    tls-ca: ${PASSAGE_AGENT_TLS_CA:}
    tls-cert: ${PASSAGE_AGENT_TLS_CERT:}
    tls-key: ${PASSAGE_AGENT_TLS_KEY:}

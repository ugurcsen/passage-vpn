spring:
  application:
    name: opnl-vpn
  profiles:
    active: ${OPNL_PROFILE:sqlite}
  datasource:
    url: ${OPNL_DB_URL:jdbc:sqlite:./data/opnl.db?journal_mode=WAL&busy_timeout=5000&foreign_keys=on}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 5
      connection-timeout: 10000
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 256MB
      max-request-size: 256MB
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

server:
  port: ${OPNL_SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: native
  tomcat:
    threads:
      # Bounded request threads: the panel is a small fleet admin tool, not a public API.
      max: ${OPNL_TOMCAT_THREADS:50}
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
      trusted-proxies: ${OPNL_TRUSTED_PROXIES:172.16.0.0/12}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    persist-authorization: true
  api-docs:
    path: /v3/api-docs

opnl:
  data-dir: ${OPNL_DATA_DIR:./data}
  brand-name: ${OPNL_BRAND_NAME:OpenVPN Panel}
  demo-mode: ${OPNL_DEMO_MODE:false}
  internal-token: ${OPNL_INTERNAL_TOKEN:change-me-internal-token}
  jwt:
    secret: ${OPNL_JWT_SECRET:}
    access-ttl-seconds: 900
    refresh-ttl-days: 14
  auth:
    provider: ${OPNL_AUTH_PROVIDER:local}
    lockout-max-attempts: 5
    lockout-window-seconds: 300
    lockout-duration-seconds: 300
    rate-limit-max-requests: ${OPNL_AUTH_RATE_LIMIT_MAX:20}
    rate-limit-window-seconds: ${OPNL_AUTH_RATE_LIMIT_WINDOW:60}
  openvpn:
    mgmt-host: ${OPNL_OPENVPN_MGMT_HOST:openvpn}
    mgmt-port: ${OPNL_OPENVPN_MGMT_PORT:7505}
    mgmt-password: ${OPNL_OPENVPN_MGMT_PASSWORD:}
    admin-host: ${OPNL_OPENVPN_ADMIN_HOST:localhost}
    pki-dir: ${OPNL_PKI_DIR:./data/pki}
    ccd-dir: ${OPNL_CCD_DIR:./data/ccd}
    config-dir: ${OPNL_CONFIG_DIR:./data/config}
    scripts-dir: ${OPNL_SCRIPTS_DIR:./data/config/scripts}
    scripts-src-dir: ${OPNL_SCRIPTS_SRC_DIR:./openvpn/scripts}
    easyrsa-bin: ${OPNL_EASY_RSA_BIN:easyrsa}
    cert-expire-days: ${OPNL_PKI_CERT_EXPIRE:730}
    log-dir: ${OPNL_LOG_DIR:./data/config/logs}
    internal-base-url: ${OPNL_INTERNAL_BASE_URL:http://backend:8080}
  internal:
    mtls-port: ${OPNL_INTERNAL_MTLS_PORT:9443}
    tls-dir: ${OPNL_INTERNAL_TLS_DIR:./data/internal-tls}

logging:
  level:
    root: ${OPNL_LOG_LEVEL:INFO}
    com.opnl.vpn: DEBUG

# Generated by the OpenVPN management panel backend.
# Placeholders (__XXX__) are substituted by ServerConfigGenerator.
# Do not edit manually — changes are overwritten on apply.

# --- Network / transport ---
port __PORT__
proto __PROTO__
dev tun
__CLIENT_CERT_NOT_REQUIRED__

# --- PKI ---
ca __PKI_DIR__/ca.crt
cert __PKI_DIR__/server.crt
key __PKI_DIR__/server.key
dh none
tls-crypt __PKI_DIR__/ta.key
tls-version-min 1.2
cipher AES-256-GCM
data-ciphers AES-256-GCM:AES-128-GCM:CHACHA20-POLY1305
auth SHA256
remote-cert-tls client
verify-client-cert require

# --- Addressing ---
topology subnet
server __SUBNET__ __SUBNET_MASK__
ifconfig-pool-persist __LOG_DIR__/ipp.txt
keepalive 10 120

# --- Client pushes ---
__DNS_PUSH__
__ROUTE_PUSH__
__EXTRA_PUSH__

# --- Management interface ---
management 0.0.0.0 __MGMT_PORT__
management-client-auth
management-signal
management-hold

# --- Status / logging ---
status __LOG_DIR__/status 5
status-version 3
verb 3
log-append __LOG_DIR__/openvpn.log

# --- Per-user config ---
client-config-dir __CCD_DIR__
ccd-exclusive
crl-verify __PKI_DIR__/crl.pem

# --- Scripts (call back into the backend) ---
script-security 3
__AUTH_VERIFY__
client-connect __SCRIPTS_DIR__/client-connect.sh
client-disconnect __SCRIPTS_DIR__/client-disconnect.sh
learn-address __SCRIPTS_DIR__/learn-address.sh

# PostgreSQL deployment override.
# Usage: docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d
# Requires PASSAGE_PROFILE=postgres (see install.sh --profile=postgres).
services:
  db:
    image: postgres:16-alpine
    container_name: passage-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: passage
      POSTGRES_USER: ${PASSAGE_DB_USER:-passage}
      POSTGRES_PASSWORD: ${PASSAGE_DB_PASSWORD:-passage}
    volumes:
      - passage-postgres:/var/lib/postgresql/data
    networks:
      - passage-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PASSAGE_DB_USER:-passage}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    depends_on:
      db:
        condition: service_healthy
    environment:
      PASSAGE_PROFILE: postgres
      PASSAGE_DB_URL: jdbc:postgresql://db:5432/passage
      PASSAGE_DB_USER: ${PASSAGE_DB_USER:-passage}
      PASSAGE_DB_PASSWORD: ${PASSAGE_DB_PASSWORD:-passage}
    volumes:
      - passage-data:/var/lib/passage
      - passage-pki:/etc/passage/pki
      - passage-ccd:/etc/passage/ccd
      - passage-config:/etc/passage/config

volumes:
  passage-postgres:

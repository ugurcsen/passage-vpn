# PostgreSQL deployment override — compose-managed database.
# Usage: docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d
# Requires PASSAGE_PROFILE=postgres (see install.sh --profile=postgres).
#
# Remote PostgreSQL: do NOT use this override file at all — set
# PASSAGE_PROFILE=postgres + PASSAGE_DB_URL/USER/PASSWORD in .env and run a plain
# 'docker compose up -d' (the base compose passes those variables through).
services:
  db:
    image: postgres:16-alpine
    container_name: passage-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: passage
      POSTGRES_USER: ${PASSAGE_DB_USER:-passage}
      POSTGRES_PASSWORD: ${PASSAGE_DB_PASSWORD:-passage}
    volumes:
      - passage-postgres:/var/lib/postgresql/data
    networks:
      - passage-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PASSAGE_DB_USER:-passage}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    depends_on:
      db:
        condition: service_healthy
    environment:
      PASSAGE_PROFILE: postgres
      PASSAGE_DB_URL: ${PASSAGE_DB_URL:-jdbc:postgresql://db:5432/passage}
      PASSAGE_DB_USER: ${PASSAGE_DB_USER:-passage}
      PASSAGE_DB_PASSWORD: ${PASSAGE_DB_PASSWORD:-passage}

volumes:
  passage-postgres:

# PostgreSQL deployment override.
# Usage: docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d
# Requires OPNL_PROFILE=postgres (see install.sh --profile=postgres).
services:
  db:
    image: postgres:16-alpine
    container_name: opnl-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: opnl
      POSTGRES_USER: ${OPNL_DB_USER:-opnl}
      POSTGRES_PASSWORD: ${OPNL_DB_PASSWORD:-opnl}
    volumes:
      - opnl-postgres:/var/lib/postgresql/data
    networks:
      - opnl-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OPNL_DB_USER:-opnl}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    depends_on:
      db:
        condition: service_healthy
    environment:
      OPNL_PROFILE: postgres
      OPNL_DB_URL: jdbc:postgresql://db:5432/opnl
      OPNL_DB_USER: ${OPNL_DB_USER:-opnl}
      OPNL_DB_PASSWORD: ${OPNL_DB_PASSWORD:-opnl}
    volumes:
      - opnl-data:/var/lib/opnl
      - opnl-pki:/etc/opnl/pki
      - opnl-ccd:/etc/opnl/ccd
      - opnl-config:/etc/opnl/config

volumes:
  opnl-postgres:

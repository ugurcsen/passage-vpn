# Base dnsmasq config for the OpenVPN container.
#
# Serves as the VPN DNS: pinned domain entries written by the backend into
# /etc/opnl/config/dnsmasq.d/opnl-domains.conf are loaded via conf-dir, so
# clients always resolve controlled domains to the addresses the per-client
# firewall rules match. All other names resolve via the public upstreams below.
#
# The entrypoint appends the per-daemon tun server IP (e.g. 10.8.0.1) as an
# extra --listen-address so VPN clients can reach this resolver over the tun.
no-hosts
no-resolv
server=1.1.1.1
server=8.8.8.8
bind-interfaces
listen-address=127.0.0.1
conf-dir=/etc/opnl/config/dnsmasq.d/,*.conf
